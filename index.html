<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Git Quiz</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
            <header class="header">
                <h1>Git Quiz</h1>
            </header>
            <h2>Willkommen zu dieser Quiz</h2>
                <p class="text-center fs-5 pb-2">
                    Hier kannst du dein Wissen über Git testen.
                </p>
        </div>
        <div class="container">

                <h5>
                    Drücke auf den knopf hier unten damit du den quiz anfangen
                    kannst.
                </h5>
            
                    <div class="img-wrapper">
                    <img
                        class="git-img"
                        src="https://git-scm.com/images/logo@2x.png"
                        alt="Git Logo"
                    />
                </div>
                <div>
                    <button class="button" onclick="startQuiz()">
                        startte den quiz!
                    </button>
                </div>
            </div>

        <script src="js/main.js"></script>
    </body>
</html>
